{% extends "base.html" %}

{% block content %}
<style>
    /* Estilos específicos para os cards de resumo garantirem legibilidade correta nos dois temas */
    .card-resumo-total { 
        background: var(--container-bg); 
        border: 1px solid var(--border-color);
        border-left: 5px solid #2e7d32;
        padding: 15px; 
        border-radius: 5px; 
        flex: 1; 
    }
    .card-resumo-qtd { 
        background: var(--container-bg); 
        border: 1px solid var(--border-color);
        border-left: 5px solid #1565c0;
        padding: 15px; 
        border-radius: 5px; 
        flex: 1; 
    }
    .valor-destaque-verde { font-size: 1.5em; font-weight: bold; color: #2e7d32; }
    .valor-destaque-azul { font-size: 1.5em; font-weight: bold; color: #1565c0; }
</style>

<h2>Relatório Consolidado da Folha de Pagamento</h2>

<div style="display: flex; gap: 20px; margin-bottom: 20px;">
    <div class="card-resumo-total">
        <strong>Total da Folha:</strong> <br>
        <span id="resumo-total" class="valor-destaque-verde">Carregando...</span>
    </div>
    <div class="card-resumo-qtd">
        <strong>Qtd. Colaboradores:</strong> <br>
        <span id="resumo-qtd" class="valor-destaque-azul">-</span>
    </div>
</div>

<button onclick="window.print()" style="margin-bottom: 15px; background: #2c3e50; color: white;">Imprimir Relatório Geral</button>

<table>
    <thead>
        <tr>
            <th>Matrícula</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Salário Base</th>
            <th>Adicionais</th>
            <th>Salário Final</th>
        </tr>
    </thead>
    <tbody id="tabela-folha-geral"></tbody>
</table>

<script>
    window.onload = function() {
        fetch('/api/folha_consolidada')
            .then(res => res.json())
            .then(dados => {
                // Atualiza os resumos
                document.getElementById('resumo-total').innerText = `R$ ${dados.total_folha.toFixed(2)}`;
                document.getElementById('resumo-qtd').innerText = dados.quantidade_colaboradores;

                // Preenche a tabela detalhada
                const tbody = document.getElementById('tabela-folha-geral');
                tbody.innerHTML = '';
                
                dados.detalhes.forEach(colab => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${colab.matricula}</td>
                        <td>${colab.nome}</td>
                        <td>${colab.tipo}</td>
                        <td>R$ ${colab.salario_base.toFixed(2)}</td>
                        <td>R$ ${colab.adicionais.toFixed(2)}</td>
                        <td><strong>R$ ${colab.salario_final.toFixed(2)}</strong></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    };
</script>
{% endblock %}
