{% extends "base.html" %}

{% block content %}
<style>
    /* Corrige o vazamento dos inputs para fora das divs */
    input, select { box-sizing: border-box; }
</style>

<h2>Alterar Colaborador</h2>

<form id="formAlteracao" onsubmit="atualizarColaborador(event)" style="max-width: 500px;">
    <div style="margin-bottom: 10px;">
        <label>Nome:</label>
        <input type="text" id="nome" required style="width: 100%;">
    </div>
    <div style="margin-bottom: 10px;">
        <label>Salário Base (R$):</label>
        <input type="number" id="salario_base" step="0.01" min="0" required style="width: 100%;">
    </div>
    <div style="margin-bottom: 15px;">
        <label>Tipo de Colaborador (Inalterável):</label>
        <select id="tipo_colaborador" style="width: 100%;" disabled>
            <option value="Padrão">Padrão</option>
            <option value="Comissionado">Comissionado</option>
            <option value="Producao">Por Produção</option>
        </select>
    </div>

   <!-- Campos Comissionado -->
    <div id="campos_comissionado" style="display: none; background: var(--alert-bg); border: 1px solid var(--alert-border); color: var(--text-color); padding: 15px; margin-bottom: 15px; border-radius: 4px;">
        <label>Valor das Vendas (R$):</label>
        <input type="number" id="valor_vendas" step="0.01" min="0" style="width: 100%; margin-bottom: 10px;">
        
        <label>Comissão (%):</label>
        <input type="number" id="percentual_comissao" step="0.01" min="0.01" style="width: 100%;">
    </div>
    
    <!-- Campos Produção -->
    <div id="campos_producao" style="display: none; background: var(--alert-bg); border: 1px solid var(--alert-border); color: var(--text-color); padding: 15px; margin-bottom: 15px; border-radius: 4px;">
        <label>Quantidade Produzida:</label>
        <input type="number" id="quantidade_produzida" min="0" style="width: 100%; margin-bottom: 10px;">
        
        <label>Valor por Unidade (R$):</label>
        <input type="number" id="valor_unidade" step="0.01" min="0.01" style="width: 100%;">
    </div>    

    <button type="submit" style="width: 100%; padding: 10px; background-color: #f39c12; color: white; border: none; border-radius: 4px; font-weight: bold;">Salvar Alterações</button>
</form>

<script>
    const matricula = parseInt("{{ matricula }}");

    window.onload = function() {
        fetch(`/api/colaboradores/${matricula}`)
            .then(res => res.json())
            .then(dados => {
                document.getElementById('nome').value = dados.nome;
                document.getElementById('salario_base').value = dados.salario_base;
                document.getElementById('tipo_colaborador').value = dados.tipo_colaborador;

                if (dados.tipo_colaborador === 'Comissionado') {
                    document.getElementById('campos_comissionado').style.display = 'block';
                    document.getElementById('valor_vendas').value = dados.valor_vendas || '';
                    document.getElementById('percentual_comissao').value = dados.percentual_comissao || '';
                } else if (dados.tipo_colaborador === 'Producao') {
                    document.getElementById('campos_producao').style.display = 'block';
                    document.getElementById('quantidade_produzida').value = dados.quantidade_produzida || '';
                    document.getElementById('valor_unidade').value = dados.valor_unidade || '';
                }
            });
    };

    function atualizarColaborador(event) {
        event.preventDefault();

        const dados = {
            nome: document.getElementById('nome').value,
            salario_base: parseFloat(document.getElementById('salario_base').value),
            tipo_colaborador: document.getElementById('tipo_colaborador').value,
            valor_vendas: parseFloat(document.getElementById('valor_vendas').value || 0),
            percentual_comissao: parseFloat(document.getElementById('percentual_comissao').value || 0),
            quantidade_produzida: parseInt(document.getElementById('quantidade_produzida').value || 0),
            valor_unidade: parseFloat(document.getElementById('valor_unidade').value || 0)
        };

        fetch(`/api/colaboradores/${matricula}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
        .then(res => res.json())
        .then(retorno => {
            if(retorno.erro) alert('Erro: ' + retorno.erro);
            else {
                alert(retorno.mensagem);
                window.location.href = '/';
            }
        });
    }
</script>
{% endblock %}
